[project]
name = "room-of-conformations"
version = "2.0.0"
description = "The Room of Conformations: all-atom conformational ensembles from elastic network normal modes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
dependencies = [
    "prody>=2.6",
    "MDAnalysis>=2.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "flask>=3.0",
]

[project.optional-dependencies]
clustenm = ["openmm>=8.1", "pdbfixer>=1.10"]

[tool.uv]
package = false
